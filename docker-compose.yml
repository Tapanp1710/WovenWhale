# Local development infrastructure. Production uses Supabase Postgres (DATABASE_URL)
# and a managed Redis (REDIS_URL).
services:
  postgres:
    image: postgres:16-alpine
    container_name: wovenwhale-postgres
    environment:
      POSTGRES_USER: wovenwhale
      POSTGRES_PASSWORD: wovenwhale
      POSTGRES_DB: wovenwhale
    ports:
      - "54329:5432"
    volumes:
      - wovenwhale-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wovenwhale"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wovenwhale-redis
    profiles: ["queue"]
    ports:
      - "63799:6379"

volumes:
  wovenwhale-pg:
