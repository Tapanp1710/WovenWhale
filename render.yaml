# Render Blueprint for the commerce API (demo deployment, free plan).
# The API listens on the PORT Render provides and runs migrations on start.
# Render → New → Blueprint → pick this repository. Values marked `sync: false`
# are asked for in the dashboard: copy them from your .env.demo (never commit it).
# The storefront is deployed separately on Vercel (see docs/deployment.md).
services:
  - type: web
    name: wovenwhale-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      # Demo only: sign in with a password. The real store must use "true" (enforced at boot).
      - key: ADMIN_MFA_REQUIRED
        value: "false"
      # Measured on the live demo: X-Forwarded-For = visitor, Vercel, Cloudflare (Render edge),
      # Render internal. The visitor is 4 entries from the right. Re-check with
      # GET /api/admin/diagnostics/request if the hosting chain changes.
      - key: TRUSTED_PROXY_HOPS
        value: "4"
      - key: PAYMENT_PROVIDER
        value: mock
      - key: OTP_PROVIDER
        value: mock
      - key: OTP_DEV_FIXED_CODE
        value: "123456"
      - key: WHATSAPP_PROVIDER
        value: log
      - key: WHATSAPP_SEND_ENABLED
        value: "false"
      - key: STORAGE_PROVIDER
        value: database
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: MOCK_PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: SITE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
