# Render's free plan puts the API to sleep after 15 minutes without traffic, and
# the next visitor waits 30-60 s for it to wake up. A health check every 10
# minutes keeps it awake (one always-on service fits in the free 750 hours/month).
# ponytail: GitHub may run schedules a few minutes late; a paid Render plan removes the need for this.
name: Keep the demo API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 120 --retry 2 https://wovenwhale-1.onrender.com/api/health
